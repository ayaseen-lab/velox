<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reachly — Sign in</title>
  <link rel="stylesheet" href="/css/style.css?v=7">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
    }

    .login-card {
      width: min(420px, calc(100vw - 32px));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--primary);
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .login-field {
      margin-bottom: 16px;
    }

    .login-field label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .login-field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 1rem;
    }

    .login-field input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .login-error {
      display: none;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      font-size: 0.9rem;
    }

    .login-error.visible {
      display: block;
    }

    .login-btn {
      width: 100%;
      margin-top: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .login-btn:hover {
      background: var(--primary-hover);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      <span>Reachly</span>
    </div>
    <p class="login-subtitle">Enter the dashboard password to continue.</p>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm">
      <div class="login-field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required autofocus>
      </div>
      <button class="login-btn" id="loginBtn" type="submit">Sign in</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    async function checkSession() {
      const res = await fetch('/api/auth/status', { credentials: 'same-origin' });
      const data = await res.json();
      if (data.authenticated) window.location.href = '/';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.remove('visible');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Invalid password');
        window.location.href = '/';
      } catch (err) {
        loginError.textContent = err.message || 'Invalid password';
        loginError.classList.add('visible');
        passwordInput.focus();
        passwordInput.select();
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign in';
      }
    });

    checkSession();
  </script>
</body>
</html>
