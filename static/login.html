<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reachly — Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=6">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Outfit, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at top, rgba(99, 102, 241, 0.18), transparent 40%),
        var(--bg);
    }

    .login-card {
      width: min(420px, calc(100vw - 32px));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--primary);
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .login-field {
      margin-bottom: 16px;
    }

    .login-field label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .login-field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 1rem;
    }

    .login-field input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .login-error {
      display: none;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      font-size: 0.9rem;
    }

    .login-error.visible {
      display: block;
    }

    .login-btn {
      width: 100%;
      margin-top: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .login-btn:hover {
      background: var(--primary-hover);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .login-hint {
      margin-top: 16px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      <span>Reachly</span>
    </div>
    <p class="login-subtitle" id="loginSubtitle">Sign in to continue.</p>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm">
      <div class="login-field hidden" id="emailField">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@company.com" autocomplete="email">
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required autofocus>
      </div>
      <button class="login-btn" id="loginBtn" type="submit">Sign in</button>
    </form>

    <p class="login-hint" id="loginHint"></p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const emailField = document.getElementById('emailField');
    const loginSubtitle = document.getElementById('loginSubtitle');
    const loginHint = document.getElementById('loginHint');

    let authMode = 'password';
    let supabaseUrl = '';
    let supabaseAnonKey = '';

    async function apiFetch(path, options = {}) {
      const res = await fetch(path, {
        credentials: 'same-origin',
        ...options,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.error_description || data.message || 'Request failed');
      return data;
    }

    async function loadAuthConfig() {
      const config = await apiFetch('/api/auth/config');
      authMode = config.mode || 'password';

      if (authMode === 'supabase') {
        supabaseUrl = config.supabaseUrl;
        supabaseAnonKey = config.supabaseAnonKey;
        emailField.classList.remove('hidden');
        emailInput.required = true;
        emailInput.value = config.adminEmail || '';
        loginSubtitle.textContent = 'Sign in with your Reachly account.';
        loginHint.textContent = 'Supabase login enabled. Dashboard password 8888 still works as backup.';
      } else {
        loginSubtitle.textContent = 'Enter the dashboard password to continue.';
        loginHint.textContent = 'Local dashboard password login.';
      }
    }

    async function checkSession() {
      const data = await apiFetch('/api/auth/status');
      if (data.authenticated) window.location.href = '/';
    }

    async function loginWithSupabase(email, password) {
      const res = await fetch(`${supabaseUrl}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: {
          apikey: supabaseAnonKey,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error_description || data.msg || data.error || 'Supabase login failed');
      }
      await apiFetch('/api/auth/supabase', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: data.access_token }),
      });
    }

    async function loginWithPassword(password) {
      await apiFetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.remove('visible');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        if (authMode === 'supabase') {
          try {
            await loginWithSupabase(emailInput.value.trim(), passwordInput.value);
          } catch (supabaseErr) {
            await loginWithPassword(passwordInput.value);
          }
        } else {
          await loginWithPassword(passwordInput.value);
        }
        window.location.href = '/';
      } catch (err) {
        loginError.textContent = err.message || 'Login failed';
        loginError.classList.add('visible');
        passwordInput.focus();
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign in';
      }
    });

    loadAuthConfig()
      .then(() => checkSession())
      .catch((err) => {
        loginError.textContent = err.message || 'Could not load login configuration';
        loginError.classList.add('visible');
      });
  </script>
</body>
</html>
